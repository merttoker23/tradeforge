name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TF_TEST_DATABASE_URL: postgresql+psycopg://postgres:disposable_ci_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Install locked local tooling
        run: uv sync --locked --python 3.12
      - name: Format and lint
        run: |
          uv run --frozen --offline ruff format --check .
          uv run --frozen --offline ruff check .
      - name: Strict typing
        run: uv run --frozen --offline mypy
      - name: Python unit, integration, replay and execution safety tests
        run: uv run --frozen --offline pytest -q
      - name: Audit deployment controller dependencies
        run: uv run --frozen pip-audit --no-deps --disable-pip -r deploy/automation/requirements.txt
      - name: Dashboard source freshness regression tests
        run: node --test tests/frontend/*.cjs
      - name: Tracked legacy and secret gate
        run: uv run --frozen --offline python -m tools.check_repository
      - name: Audit locked dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt --output-file /tmp/tradeforge-requirements.txt
          uv run --frozen pip-audit --no-deps --disable-pip -r /tmp/tradeforge-requirements.txt
      - name: Build wheel offline
        run: uv build --offline --no-build-isolation
      - name: Whitespace check
        run: git diff --check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_DOMAIN: trade.example.com
      TF_SECRETS_DIR: /tmp/tradeforge-compose-secrets
      TF_MODE: paper
      TF_DEMO_ORDERS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check Linux Docker and Compose
        run: |
          docker version
          docker compose version
      - name: Provision disposable CI secrets
        run: sudo python3 deploy/linux/provision.py "$TF_SECRETS_DIR"
      - name: Validate Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build real Linux runtime image
        run: docker compose -f deploy/docker-compose.yml build --pull
      - name: Validate Caddy configuration
        run: >-
          docker compose -f deploy/docker-compose.yml run --rm --no-deps caddy
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify migrations and PostgreSQL volume continuity
        run: |
          docker compose -f deploy/docker-compose.yml up -d --wait postgres
          docker compose -f deploy/docker-compose.yml run --rm migrate
          docker compose -f deploy/docker-compose.yml exec -T postgres psql -U tradeforge_owner -d tradeforge -v ON_ERROR_STOP=1 -c 'CREATE TABLE ci_volume_probe (id integer PRIMARY KEY); INSERT INTO ci_volume_probe VALUES (42)'
          docker compose -f deploy/docker-compose.yml restart postgres
          for attempt in $(seq 1 30); do
            if docker compose -f deploy/docker-compose.yml exec -T postgres pg_isready -h 127.0.0.1 -U tradeforge_owner -d tradeforge; then break; fi
            sleep 1
          done
          test "$(docker compose -f deploy/docker-compose.yml exec -T postgres psql -U tradeforge_owner -d tradeforge -Atc 'SELECT id FROM ci_volume_probe')" = 42
      - name: Stop disposable CI containers
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --remove-orphans
